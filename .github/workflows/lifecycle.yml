# Stage advance on merge (#4, intent/4-labels/). INTENT.md's lifecycle
# says the merge IS the state transition; this workflow is the thin
# thing that mirrors that transition into the issue's labels so humans
# and later automation can read the stage without reading the diff.
#
# All the logic lives in scripts/ci/lifecycle_advance.sh, runnable
# locally by the same command this file runs — a workflow nobody can
# reproduce on a laptop is a workflow nobody debugs. Zero model calls:
# a merged path and a `Status:` line are the whole input.
#
# The status:* label writes and handoff comments this posts come from
# github-actions[bot], the default token's identity. That is deliberate
# and it is NOT a persona: the six personas (INTENT.md) are named actors
# with their own GitHub identities and their own authority; this is
# infrastructure moving a label, so it speaks as infrastructure. A label
# written with the default token starts no workflow (#64, D16), which is
# why it stays on that token even though the job below also holds the
# merge actor's credential for a narrower purpose.
#
# Themis (`<owner>-themis-app`) holds the merge-actor role; it is a
# system actor with no prompt, harness or goals, and the six personas in
# INTENT.md are unchanged.
#
# The job DOES hold one secret (#64, D23): the Themis App's private
# key, minted under the `themis` Environment (deployment-branch
# policy: `main` only) into `MERGE_ACTOR_TOKEN`, reaching only the one
# step below that runs lifecycle_advance.sh and, on a D14 refusal, calls
# scripts/ci/escalate.sh in that same step. Both writes state-carrying
# comments (the loop ledger, the escalation marker) under that token so
# only the merge actor's own login is ever trusted state (D23); every
# other gh call in that step keeps GH_TOKEN as github.token (D25).
#
# Concurrency queues rather than cancels: two pushes landing close
# together are two different ranges, and dropping the older one loses
# its transitions for good.

name: Lifecycle

on:
  push:
    branches: [main]

permissions:
  issues: write
  contents: read
  # The implement rung advances on a merged pull request found through
  # `gh api repos/<repo>/commits/<sha>/pulls` (#57, D1/D3). This is the
  # only new scope; there is no second trigger, no second job and no
  # secret.
  pull-requests: read

concurrency:
  group: lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  advance:
    name: advance — mirror merge gates into status labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # #64 D23: the merge actor's token is minted under this Environment,
    # whose deployment-branch policy admits only `main` — the same
    # binding merge-gate.yml's `gate` job uses.
    environment: themis
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The whole job is a diff between two commits; a shallow
          # clone has neither of them.
          fetch-depth: 0

      - name: Mint the merge actor's token
        id: merge-actor
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.THEMIS_APP_ID }}
          private-key: ${{ secrets.THEMIS_APP_PRIVATE_KEY }}

      - name: Advance the stage labels for this push
        env:
          GITHUB_REPO: ${{ github.repository }}
          # The default token. No PAT, no persona identity. Stays on
          # this token for the status:* label swap (D26): a write with
          # the default token starts no workflow.
          GH_TOKEN: ${{ github.token }}
          # #64 D25: reaches only this one step, which runs both
          # lifecycle_advance.sh and (on a D14 refusal) escalate.sh —
          # both post state-carrying comments trusted only from the
          # merge actor's own login (D23).
          MERGE_ACTOR_TOKEN: ${{ steps.merge-actor.outputs.token }}
          # Event data reaches the script through env, never through
          # `${{ }}` interpolated into the run body — the same rule
          # ci-gates.yml follows for the PR body (#6, D10). These two
          # are SHAs today; the habit is what keeps the next field
          # someone adds here from being an injection.
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          rc=0
          bash scripts/ci/lifecycle_advance.sh "$BEFORE_SHA" "$AFTER_SHA" 2> stderr.log || rc=$?
          cat stderr.log >&2
          # #64 D13/D14: the advancer refuses, writes its ledger row and
          # names the reason on stderr; this step is escalate.sh's one
          # caller on that path (D19). A budget refusal leaves the run
          # green (D13); a non-monotonic one has already made it red.
          { grep -oE 'refusal reason-code: (budget|non-monotonic) for #[0-9]+' stderr.log || true; } \
            | sort -u | while read -r _ _ reason _ issue; do
                bash scripts/ci/escalate.sh "${issue#\#}" --reason "$reason" --head "$AFTER_SHA"
              done
          exit "$rc"
