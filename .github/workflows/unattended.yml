# Event capture for unattended personas (#25, D7, D11, D16, D18).
#
# THIS IS THE TRIGGER, NOT THE RUNTIME. It notices an event, asks
# scripts/ops/execution.py which personas subscribe to it, and hands
# each one to its placement adapter. Moving a persona between
# placements changes config/execution.yaml and NOT this file — that is
# what D18 prices at one line, and a workflow that knew where a persona
# runs would be the second place to edit.
#
# Nothing here names a model, a tier, a dollar cap, a stage, a folder, a
# branch or a prompt (D8, D15, D16). The persona names and their
# placements are read from config/execution.yaml at run time; the only
# thing this file states about a persona is the CONVENTION for its
# secret's name, and the adapter checks that against the name in the
# persona source rather than trusting it.
#
# THE FORK-SECRETS TRIGGER IS FORBIDDEN (D7) — the `..._target` variant
# of the pull-request event, which runs a fork's code against this
# repository's secrets. That is precisely the exposure the public-repo
# constraint is about. Its name is deliberately not spelled anywhere in
# `.github/workflows/`, because D7's testable is a grep for the literal
# across that directory: a comment saying "never X" and a workflow using
# X are indistinguishable to it. A fork pull request gets human review
# only, and the `if:` guard on the resolve job below says so out loud
# rather than failing somewhere confusing.

name: Unattended personas

# The `on:` list repeats the `events` values in config/execution.yaml
# because GitHub requires a static trigger list — a workflow cannot ask
# a file what to wake on. `execution.py --check` (the fourth CI gate)
# therefore holds this block TO that file: the gate fails if any
# repo-event binding subscribes to an event this list omits. The
# duplication is a checked derivation, not a second source of truth.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      number:
        description: 'Issue or pull-request number to work'
        required: true
        type: string
      persona:
        description: 'Persona to dispatch (must have a binding in config/execution.yaml)'
        required: true
        type: string
      dry_run:
        description: 'DRY_RUN=1 — resolve, print, write nothing'
        required: false
        default: true
        type: boolean

# No GitHub write grant at all. Every GitHub write an unattended run
# makes is a persona App's, through scripts/ops/post.sh with that App's
# own token — never this workflow's GITHUB_TOKEN. (The dispatch job adds
# `id-token: write`, which is an OIDC token for cloud federation, not a
# GitHub write; see the comment there.)
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: unattended-${{ github.event.pull_request.number || inputs.number }}
  cancel-in-progress: false

jobs:
  # Deterministic, no secrets, no model call: turn one event into the
  # list of (persona, placement) pairs that subscribe to it. Split from
  # the dispatch job below for two reasons, both load-bearing:
  # `secrets[...]` is evaluated before a step runs and so can only be
  # indexed by a MATRIX value, not by something a shell computed; and
  # D11's Observable asks for one run log per reviewer that the room can
  # open, which a single job posting both reviews cannot produce.
  resolve:
    name: resolve — which personas subscribe to this event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # A fork pull request gets human review only (D7). Checked here so
    # the whole matrix is empty rather than each adapter refusing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      matrix: ${{ steps.subscribers.outputs.matrix }}
      any: ${{ steps.subscribers.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Resolve subscribers
        id: subscribers
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PERSONA: ${{ inputs.persona }}
          PR_ACTION: ${{ github.event.action }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL_NAME: ${{ github.event.label.name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # One named persona, its placement read from the same file.
            binding="$(python3 scripts/ops/execution.py --binding "$INPUT_PERSONA")"
            printf '%s\t%s\n' "$INPUT_PERSONA" "$(awk '{print $2}' <<<"$binding")" \
              > subscribers.tsv
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            # Draft PRs skip review dispatch entirely (#265 D2, AT-9)
            if [ "${IS_DRAFT:-false}" = "true" ] || [ "${{ github.event.pull_request.draft }}" = "true" ]; then
              echo "PR is draft; skipping review dispatch"
              : > subscribers.tsv
            elif [ "$PR_ACTION" = "labeled" ]; then
              if [ "$LABEL_NAME" != "deep-review" ]; then
                echo "Label '$LABEL_NAME' is not deep-review; skipping dispatch"
                : > subscribers.tsv
              else
                # Resolve current rung from branch/issue
                RUNG=""
                if [[ "$HEAD_REF" =~ ^[a-zA-Z0-9_-]+/([0-9]+)- ]]; then
                  ISSUE_NUM="${BASH_REMATCH[1]}"
                  ISSUE_JSON="$(gh api "repos/$GITHUB_REPO/issues/$ISSUE_NUM" 2>/dev/null || true)"
                  STATUS_LABEL="$(jq -r '.labels[].name' <<<"$ISSUE_JSON" 2>/dev/null | grep '^status:' | head -1 || true)"
                  case "$STATUS_LABEL" in
                    status:planning) RUNG="plan" ;;
                    status:spec) RUNG="design" ;;
                    status:build) RUNG="build" ;;
                    status:implementing) RUNG="implement" ;;
                  esac
                fi
                RUNG="${RUNG:-implement}"

                # Query timeline for existing grants on this PR
                EXISTING="$(gh api "repos/$GITHUB_REPO/issues/$PR_NUMBER/timeline" --paginate 2>/dev/null \
                  | jq -r --arg rung "$RUNG" '[.[] | select(.event == "labeled" and .label.name == "deep-review")] | if length > 1 then (.[0:-1][] | (.rung // $rung)) else empty end' 2>/dev/null || true)"

                # Run check-grant
                CHECK_ERR="$(python3 scripts/ops/execution.py --check-grant --pr "$PR_NUMBER" --rung "$RUNG" --existing-grants $EXISTING 2>&1)" || CHECK_STATUS=$?
                if [ "${CHECK_STATUS:-0}" -ne 0 ]; then
                  echo "Grant check failed; deleting label, posting refusal comment, suppressing dispatch"
                  gh api -X DELETE "repos/$GITHUB_REPO/issues/$PR_NUMBER/labels/deep-review" \
                    || { echo "::error::deep-review label removal failed for PR #$PR_NUMBER; refusing to dispatch"; exit 1; }
                  REFUSAL_MSG="${CHECK_ERR:-Refused: PR #$PR_NUMBER already received a deep-review grant on the '$RUNG' rung. Policy allows at most one deep-review grant per PR per rung (REVIEW.md, #265). Escalating to human.}"
                  gh api -X POST "repos/$GITHUB_REPO/issues/$PR_NUMBER/comments" -f body="$REFUSAL_MSG" \
                    || { echo "::error::refusal comment post failed for PR #$PR_NUMBER; refusing to dispatch"; exit 1; }
                  : > subscribers.tsv
                else
                  # Grant valid: delete label and dispatch Argus under deep-review
                  gh api -X DELETE "repos/$GITHUB_REPO/issues/$PR_NUMBER/labels/deep-review" \
                    || { echo "::error::deep-review label removal failed for PR #$PR_NUMBER; refusing to dispatch"; exit 1; }
                  python3 scripts/ops/execution.py --subscribers pull_request --action "$PR_ACTION" --labels deep-review > subscribers.tsv
                fi
              fi
            else
              # General pull_request events: opened, synchronize, reopened, ready_for_review
              STATUS_LABEL=""
              if [[ "$HEAD_REF" =~ ^[a-zA-Z0-9_-]+/([0-9]+)- ]]; then
                ISSUE_NUM="${BASH_REMATCH[1]}"
                ISSUE_JSON="$(gh api "repos/$GITHUB_REPO/issues/$ISSUE_NUM" 2>/dev/null || true)"
                STATUS_LABEL="$(jq -r '.labels[].name' <<<"$ISSUE_JSON" 2>/dev/null | grep '^status:' | head -1 || true)"
              fi

              # Get touched paths and labels from PR
              PR_JSON="$(gh api "repos/$GITHUB_REPO/pulls/$PR_NUMBER" 2>/dev/null || true)"
              PR_LABELS="$(jq -r '.labels[].name' <<<"$PR_JSON" 2>/dev/null | tr '\n' ' ' || true)"
              gh api "repos/$GITHUB_REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > pr_files.txt 2>/dev/null || true

              SUBSCRIBER_ARGS=( "--subscribers" "pull_request" "--action" "$PR_ACTION" )
              if [ -n "$STATUS_LABEL" ]; then
                SUBSCRIBER_ARGS+=( "--status-label" "$STATUS_LABEL" )
              fi
              if [ -s pr_files.txt ]; then
                SUBSCRIBER_ARGS+=( "--paths-file" "pr_files.txt" )
              fi
              if [ -n "$PR_LABELS" ]; then
                SUBSCRIBER_ARGS+=( "--labels" $PR_LABELS )
              fi

              python3 scripts/ops/execution.py "${SUBSCRIBER_ARGS[@]}" > subscribers.tsv
            fi
          else
            python3 scripts/ops/execution.py --subscribers "$EVENT_NAME" > subscribers.tsv
          fi
          echo "subscribers for $EVENT_NAME:"
          cat subscribers.tsv
          # `upper` carries the persona name in the case the secret is
          # stored under; the adapter validates it against the persona
          # source's own authority.token and fails by name if they ever
          # diverge. jq builds the JSON so a persona name with an odd
          # character cannot break out of the matrix.
          matrix="$(jq -rn --rawfile tsv subscribers.tsv '
            [ $tsv | split("\n")[] | select(length > 0) | split("\t")
              | {persona: .[0], placement: .[1], upper: (.[0] | ascii_upcase)} ]
            | tojson')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r 'length' <<<"$matrix")" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

  dispatch:
    name: ${{ matrix.persona }} via ${{ matrix.placement }}
    needs: resolve
    if: needs.resolve.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # The ONE grant beyond read: an OIDC token for this job, which the
      # auth step below exchanges for short-lived cloud credentials
      # (workload identity federation — no cloud key at rest, spec
      # `execution.placement`). It is not a GitHub write; the job still
      # cannot post, and every GitHub write remains a persona App's.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      # A reviewer's unit of work is a RANGE — `base...head` — not a
      # working tree, and checkout's default `fetch-depth: 1` gives it
      # only the merge commit with no parents: neither the PR head nor
      # the base is in the object store, and there is no diff to review
      # at all (#162). The deepening fetch that would have rescued the
      # run was refused by the harness's permission gate (#163), not by
      # the network or the runner — the distinction matters to whoever
      # reads this next and reasons about what else the runner blocks.
      # The resolve job above reads files and keeps the shallow clone;
      # this one hands a model the history its job presumes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pyjwt[crypto] pulls in cryptography, which PyJWT needs to sign
      # RS256 (scripts/auth/_github_app.py mint_jwt). Plain pyjwt fails
      # preflight with "Algorithm 'RS256' could not be found" (#126).
      - run: python3 -m pip install --disable-pip-version-check pyyaml 'pyjwt[crypto]' jsonschema

      # A subscriber whose placement this runner cannot host is one
      # NAMED skip line, never a silent drop: a persona that quietly
      # stopped being dispatched is the failure mode nobody notices.
      - name: Skip a placement this runner cannot host
        if: matrix.placement != 'gh-actions'
        # Both values travel by env rather than through `${{ }}` in the
        # run body: ci-gates.yml states the rule and every other step
        # here already honours it, so this one did not get to be the
        # exception (Argus R1-2). Neither value is attacker-controlled
        # today — they are keys of an in-tree file — but a run body
        # assembled by interpolation is the shape, not the value.
        env:
          PERSONA: ${{ matrix.persona }}
          PLACEMENT: ${{ matrix.placement }}
        run: |
          set -euo pipefail
          line="skipped: $PERSONA is placed on $PLACEMENT, which a GitHub-hosted runner does not host; its own adapter dispatches it."
          echo "::notice::$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      # ----- model access and the harness toolchain (#146) -----------------
      # A hosted runner starts with neither harness binary nor any cloud
      # credential. Everything from here to Dispatch gives it both, the
      # same way for every persona, so that this workflow never has to
      # know which harness a persona is pinned to: both binaries are
      # installed, both harnesses' credential environment is set, and
      # work.sh picks at dispatch as it does on the presenter's machine.
      #
      # Model access is provisioned ONCE per repository by
      # scripts/setup/wif_setup.sh, which creates the federation pool,
      # provider, service account and role and writes the four repository
      # variables read below. Until that has been run, the variables are
      # empty and this job SAYS SO and stops green — the same "not
      # configured yet, not broken" treatment the missing App key already
      # gets (Argus R1-1) — rather than failing at the auth step on every
      # pull request. The gate reads one variable, WIF_PROVIDER, because
      # the setup script writes all four together and a partial set is
      # its bug to report, not this file's to diagnose.
      - name: Gate on provisioned model access
        id: gate
        if: matrix.placement == 'gh-actions'
        env:
          PERSONA: ${{ matrix.persona }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
        run: |
          set -euo pipefail
          if [ -z "$WIF_PROVIDER" ]; then
            line="skipped: $PERSONA — the repository variable WIF_PROVIDER is not set, so this runner has no model access; run scripts/setup/wif_setup.sh (#146) to enable unattended runs. Nothing was dispatched."
            echo "::notice::$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud (workload identity federation)
        if: steps.gate.outputs.ready == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # The auth action writes the live credential file INTO the checkout,
      # and a launched persona can read any workspace path. Move it out,
      # and point every consumer at the new location: the two harness
      # SDKs read GOOGLE_APPLICATION_CREDENTIALS, gcloud reads the
      # override, and the action's own post-job cleanup follows
      # GOOGLE_GHA_CREDS_PATH so the file is still deleted at the end.
      - name: Move the credential out of the workspace
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/gcp-wif-creds.json"
          mv "$GOOGLE_GHA_CREDS_PATH" "$DEST"
          {
            echo "GOOGLE_GHA_CREDS_PATH=$DEST"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$DEST"
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=$DEST"
          } >> "$GITHUB_ENV"

      # Three calls into one script, so the toolchain a runner gets is the
      # one scripts/ops/tests/placement_test.sh checks and an operator can
      # reproduce by hand. `resolve` runs first because the cache key must
      # name the versions before anything is downloaded.
      - name: Resolve harness versions
        id: harness
        if: steps.gate.outputs.ready == 'true'
        run: bash scripts/ci/install_harness.sh resolve >> "$GITHUB_OUTPUT"

      - name: Restore the harness binaries from cache
        id: harness-cache
        if: steps.gate.outputs.ready == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.local/bin/agy
            ~/.local/bin/claude
            ~/.local/share/claude
          key: harness-${{ runner.os }}-agy-${{ steps.harness.outputs.agy }}-claude-${{ steps.harness.outputs.claude }}

      - name: Install the harness binaries (cache miss)
        if: steps.gate.outputs.ready == 'true' && steps.harness-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci/install_harness.sh install

      - name: Put the harness binaries on PATH and check them
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bash scripts/ci/install_harness.sh check

      # agy's second credential reaches the launcher as a FILE, and this
      # step exists so that the value is in the environment of a step
      # that does nothing else and then exits. Putting it in Dispatch's
      # environment instead would leave it readable for the whole run:
      # the kernel keeps every process's initial environment in
      # /proc/<pid>/environ, so `unset` inside work.sh cannot take it
      # back from the step process that hosts the harness, and a session
      # running as the same runner user reads it with `cat` (atlas A1-1
      # on PR #221). A path is not a secret and can be taken back — by
      # deleting the file, which work.sh does before the launch whenever
      # the persona it resolved is not on antigravity. So this file
      # stays harness-blind (D18) and still hands nothing to the
      # harnesses that must not have it.
      - name: Stage agy's model credential
        if: steps.gate.outputs.ready == 'true'
        env:
          ANTIGRAVITY_ADC_JSON: ${{ secrets.ANTIGRAVITY_ADC_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${ANTIGRAVITY_ADC_JSON:-}" ]; then
            echo "ANTIGRAVITY_ADC_JSON is not set; antigravity personas will" >&2
            echo "resolve no model. See scripts/setup/wif_setup.sh --check (#167)." >&2
            exit 0
          fi
          DEST="$RUNNER_TEMP/agy-adc.json"
          # Create empty at 0600 first, then write: the value never
          # appears in an argv, and never exists at a world-readable
          # path for even an instant.
          install -m 600 /dev/null "$DEST"
          printf '%s' "$ANTIGRAVITY_ADC_JSON" > "$DEST"
          echo "ANTIGRAVITY_ADC_FILE=$DEST" >> "$GITHUB_ENV"

      - name: Dispatch
        if: steps.gate.outputs.ready == 'true'
        env:
          # Model access for BOTH harnesses, so this file stays blind to
          # which one work.sh will launch. The credential itself is the
          # file GOOGLE_APPLICATION_CREDENTIALS names (set above); these
          # only tell each SDK to use it and which project to bill.
          CLAUDE_CODE_USE_VERTEX: '1'
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.CLAUDE_VERTEX_PROJECT_ID }}
          CLOUD_ML_REGION: global
          AGY_ADC_AUTH: 'true'
          ANTIGRAVITY_PROJECT_ID: ${{ vars.ANTIGRAVITY_PROJECT_ID }}
          # agy's SECOND credential is deliberately ABSENT from this
          # environment (#167, atlas A1-1). It is the only credential
          # WIF cannot supply: agy ships no built-in model list, fetches
          # its catalog from cloudcode-pa.googleapis.com, which serves
          # per IDENTITY ENTITLEMENT rather than per project, and a
          # federated service account holds none — measured on this
          # runner, WIF gets 0 models and every --model value is then
          # "not recognized", while an authorized_user ADC credential
          # gets 15 and the call succeeds.
          # roles/serviceusage.serviceUsageConsumer was granted and
          # re-measured at 0, so no IAM change reaches it. The staging
          # step above puts it in a file and exports only
          # $ANTIGRAVITY_ADC_FILE, which work.sh keeps for antigravity
          # and deletes for everyone else.
          # BY NAME (D3). The value is an Actions secret whose name is
          # the persona's authority.token; it reaches the adapter as the
          # variable of that name, set in the shell below, and is never
          # printed, written to a file or passed in an argument.
          PERSONA_APP_PRIVATE_KEY: ${{ secrets[format('{0}_APP_PRIVATE_KEY', matrix.upper)] }}
          # Read-only default token for everything work.sh does BEFORE
          # the launch: resolving the number, the refusal ladder, the
          # claim mutex. This job has no write permission, so it cannot
          # post; the launcher replaces it with the persona's own App
          # token in the child's environment (ops.identity) (#128).
          GH_TOKEN: ${{ github.token }}
          PERSONA: ${{ matrix.persona }}
          KEY_VAR_NAME: ${{ matrix.upper }}_APP_PRIVATE_KEY
          NUMBER: ${{ github.event.pull_request.number || inputs.number }}
          GITHUB_REPO: ${{ github.repository }}
          # The range, stated rather than inferred. This job checks out
          # the PR's MERGE ref, so `git rev-parse HEAD` is an ephemeral
          # commit that exists nowhere the ledger can point and changes
          # whenever main moves — a reviewer that records it as
          # `Reviewed-head:` records a value the head-pinned labels can
          # never match (#164 R1-2). Empty on workflow_dispatch, where
          # there is no pull request and no range to state.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
          # Not a preference: a hosted runner has no terminal, so the
          # interactive row of work.sh's launch table can never be the
          # right one here and the launcher refuses outright without
          # this (#159). Antigravity is headless whatever this says.
          HEADLESS: '1'
          # Same shape of defect as HEADLESS, one layer in: with no
          # permission mode set, print mode denies every tool that would
          # otherwise prompt, and on a runner there is nobody to prompt.
          # The first live argus run spent $0.88 and 30 turns to discover
          # that `gh api`, `gh auth status` and even `printenv` were all
          # refused, and correctly reported `blocked` rather than review
          # a PR it could not read (#163). It could not re-read the
          # `hold` gate before writing either, which trusted-posting
          # (D13) makes a hard bar on writing at all.
          #
          # The bypass is scoped by placement, not granted globally: this
          # step only ever runs for `gh-actions` (the step above skips
          # any other placement), where the runner is ephemeral, the
          # workflow's own GITHUB_TOKEN cannot write, and the ONLY write
          # credential is the persona App token that post.sh gates. A
          # HEADLESS=1 session on the presenter's laptop is a different
          # situation with a human at the keyboard and keeps prompting —
          # which is why this is set here and not in work.sh.
          #
          # It is also not the last word. Argus reviewed this line and
          # objected to the WIDTH of the grant, not to giving a reviewer
          # tools: with an unrestricted shell the App's write verbs are
          # reachable directly, around post.sh and around the `hold`
          # re-read post.sh exists to guarantee (#164 R1-1). Two answers
          # followed. work.sh now unsets the persona's App private key
          # before the launch, so a session inherits a one-hour
          # repository-scoped token and not the App itself — the half a
          # launcher can take back on its own. Whether the posture here
          # should be this bypass or an allowlist naming the verbs is a
          # Decision the spec deliberately deferred, and it is back at
          # the design gate as #168 rather than settled by this comment.
          WORK_PERMISSION_MODE: bypassPermissions
        run: |
          set -euo pipefail
          # `export NAME=value` as a builtin, never `env NAME=value cmd`:
          # argv is world-readable and D3 forbids the value appearing
          # there. xtrace is off for this line for the same reason.
          set +x
          export "$KEY_VAR_NAME=$PERSONA_APP_PRIVATE_KEY"
          unset PERSONA_APP_PRIVATE_KEY
          set +e
          bash scripts/placement/gh-actions/run.sh "$NUMBER" --as "$PERSONA" 2>&1 \
            | tee dispatch.log
          rc="${PIPESTATUS[0]}"
          set -e
          # Exit 2 is a REFUSAL, not a failure: the number was not
          # worked, by design (#36, D8). Recording it and staying green
          # is the whole point — a red X on every held or closed issue
          # trains the room to ignore the signal. What makes that
          # defensible rather than a silent pass is the next three lines:
          # the refusal's own sentence — which names the label, the state
          # or the missing secret that caused it — is copied into the run
          # summary, where a reader sees it without opening the log.
          if [ "$rc" -eq 2 ]; then
            reason="$(tail -n 1 dispatch.log)"
            echo "::notice::$PERSONA refused #$NUMBER (exit 2) — not worked, by design: $reason"
            echo "**$PERSONA did not work #$NUMBER** (refusal, exit 2): $reason" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$rc"

      # work.sh deletes this itself — before the launch when the harness
      # is not antigravity, and on EXIT/INT/TERM when it is. This is the
      # case its traps cannot reach: a job cancelled or killed hard
      # enough that the launcher never runs its handler. Last step, and
      # `always()`, so it also runs after a failed dispatch.
      - name: Remove agy's model credential
        if: always()
        run: rm -f "$RUNNER_TEMP/agy-adc.json"

