# Merge gate (#64, D3): the one place a pull request is merged
# unattended. All the judgment lives in scripts/ci/merge_gate.sh, which
# evaluates D5's eleven conjuncts and is runnable locally by the same
# command this file runs.
#
# Three jobs. `evaluate` runs on pull_request events with the default
# token, read-only, DRY_RUN=1: a same-repo pull_request run executes the
# workflow file from the pull request's head, so nothing that can write
# or mint the merge actor's token may run on that trigger. `record` and
# `gate` run on the other four triggers, which execute the workflow file
# from the default branch, under the `themis` Environment whose
# deployment-branch policy admits `main` only. `record` maintains the
# consensus ledger, and `gate` evaluates merge readiness.
#
# Themis (`<owner>-themis-app`) holds the merge-actor role; it is a
# system actor with no prompt, harness or goals, and the six personas in
# INTENT.md are unchanged.
#
# Every checkout is the literal default branch. No ref an event supplied
# is ever checked out, and a pull_request whose base is another branch
# fails closed before anything runs (D5 conjunct 1).
name: Merge Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  check_suite:
    types: [completed]
  status:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to gate
        required: true
        type: string

permissions: {}

jobs:
  evaluate:
    name: merge-gate (evaluate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
    steps:
      - name: Fail closed unless the base is the default branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "::error::merge-gate: the pull request's base is '$BASE_REF'; only main is gated (D5 conjunct 1)"
            exit 1
          fi

      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1

      - name: Evaluate the eleven conjuncts (dry run, no writes)
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: "1"
          TARGET: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f scripts/ci/merge_gate.sh ]; then
            echo "scripts/ci/merge_gate.sh is not on main — nothing to evaluate"
            exit 0
          fi
          bash scripts/ci/merge_gate.sh "$TARGET"

  record:
    name: merge-gate (record)
    if: github.event_name != 'pull_request' && (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: themis
    concurrency:
      group: merge-gate
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1

      - name: Mint the merge actor's token
        id: themis-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.THEMIS_APP_ID }}
          private-key: ${{ secrets.THEMIS_APP_PRIVATE_KEY }}

      - name: Resolve the pull request and record review consensus
        env:
          GH_TOKEN: ${{ steps.themis-token.outputs.token }}
          THEMIS_TOKEN: ${{ steps.themis-token.outputs.token }}
          GITHUB_EVENT_SENDER_LOGIN: ${{ github.event.sender.login }}
          EVENT_NAME: ${{ github.event_name }}
          CS_PR: ${{ github.event.check_suite.pull_requests[0].number }}
          CS_SHA: ${{ github.event.check_suite.head_sha }}
          STATUS_SHA: ${{ github.event.sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_PR: ${{ github.event.inputs.pull_request }}
        run: |
          case "$EVENT_NAME" in
            check_suite)
              TARGET="$CS_PR"
              [ -n "$TARGET" ] || TARGET="$(gh api "repos/$GITHUB_REPOSITORY/commits/$CS_SHA/pulls" -q '.[0].number' 2>/dev/null || true)";;
            status)
              TARGET="$(gh api "repos/$GITHUB_REPOSITORY/commits/$STATUS_SHA/pulls" -q '.[0].number' 2>/dev/null || true)";;
            issue_comment)
              TARGET="$ISSUE_NUMBER";;
            workflow_dispatch)
              TARGET="$DISPATCH_PR";;
            *)
              TARGET="";;
          esac
          if [ -z "$TARGET" ] || [ "$TARGET" = "null" ]; then
            echo "no pull request behind this $EVENT_NAME event — nothing to record"
            exit 0
          fi
          if [ ! -f scripts/ci/review_recorder.sh ]; then
            echo "scripts/ci/review_recorder.sh is not on main — nothing to record"
            exit 0
          fi
          bash scripts/ci/review_recorder.sh "$TARGET"

  gate:
    name: merge-gate
    needs: [record]
    if: github.event_name != 'pull_request' && (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: themis
    concurrency:
      group: merge-gate
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1

      - name: Mint the merge actor's token
        id: merge-actor
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.THEMIS_APP_ID }}
          private-key: ${{ secrets.THEMIS_APP_PRIVATE_KEY }}

      - name: Resolve the pull request and run the gate
        env:
          GH_TOKEN: ${{ steps.merge-actor.outputs.token }}
          # Event data reaches the script through env, never through
          # `${{ }}` interpolated into the run body (#6, D10).
          EVENT_NAME: ${{ github.event_name }}
          CS_PR: ${{ github.event.check_suite.pull_requests[0].number }}
          CS_SHA: ${{ github.event.check_suite.head_sha }}
          STATUS_SHA: ${{ github.event.sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_PR: ${{ github.event.inputs.pull_request }}
        run: |
          case "$EVENT_NAME" in
            check_suite)
              TARGET="$CS_PR"
              [ -n "$TARGET" ] || TARGET="$(gh api "repos/$GITHUB_REPOSITORY/commits/$CS_SHA/pulls" -q '.[0].number' 2>/dev/null || true)";;
            status)
              TARGET="$(gh api "repos/$GITHUB_REPOSITORY/commits/$STATUS_SHA/pulls" -q '.[0].number' 2>/dev/null || true)";;
            issue_comment)
              TARGET="$ISSUE_NUMBER";;
            workflow_dispatch)
              TARGET="$DISPATCH_PR";;
            *)
              TARGET="";;
          esac
          if [ -z "$TARGET" ] || [ "$TARGET" = "null" ]; then
            echo "no pull request behind this $EVENT_NAME event — nothing to gate"
            exit 0
          fi
          if [ ! -f scripts/ci/merge_gate.sh ]; then
            echo "scripts/ci/merge_gate.sh is not on main — nothing to gate"
            exit 0
          fi
          bash scripts/ci/merge_gate.sh "$TARGET"
