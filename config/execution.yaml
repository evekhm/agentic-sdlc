# Persona -> execution binding (#25). One axis per file (#2 D1):
# harness is config/deployments.yaml, placement is here. A persona with
# no unattended duty has no entry. No secret value, no file path and no
# home directory appears here (D3) — the private-key NAME already lives
# in personas/<name>.yaml authority.token and is not restated.
#
# Read by scripts/ops/execution.py and by nothing else: no adapter,
# workflow or shell script parses this file a second time (D2).
#
#   trigger       repo-event | scheduled | manual
#   events        the GitHub event names, for repo-event only
#   placement     an adapter directory name under scripts/placement/
#                 (D17 — a name with no adapter fails --check)
#   max_cost_usd  the enforced dollar ceiling for one run (D8; turn and
#                 time caps stay in personas/<name>.yaml limits).
#                 ENFORCED as of #108: every placement adapter exports
#                 this number as WORK_MAX_USD before it execs work.sh,
#                 which passes it to Claude Code as --max-budget-usd
#                 (pre-emptive: the run is stopped when it crosses) and
#                 measures Antigravity runs against it post-hoc from the
#                 result envelope (agy has no ceiling flag). An
#                 unreadable or non-positive value REFUSES the dispatch
#                 rather than launching without a ceiling.
#
#                 This is a RUNAWAY STOP, not a budget. Set it well above
#                 what the duty actually costs, because crossing it
#                 truncates the run: for Claude Code the session dies
#                 mid-work and the persona posts nothing, so a ceiling
#                 tuned to the median buys a half-finished review and
#                 pays for it anyway. Measure before lowering one —
#                 scripts/ops/session_spend.sh, or total_cost_usd in the
#                 job log.

personas:
  # 2.00 while the number was decorative; 8.00 now that it stops a run.
  # Measured over the four argus dispatches on 2026-09-07 that produced a
  # real review and reported a cost: $1.16, $2.70, $3.03, $3.16 (jobs
  # 101668418781, 101816531601, 101813589686, 101810893006). THREE OF THE
  # FOUR were already over 2.00, including the 07:03 review on PR #188
  # that is this repository's evidence for gate 1a — so switching
  # enforcement on at the old number would have killed the review the
  # milestone rests on, and every review of a PR big enough to matter.
  # 8.00 is ~2.5x the observed maximum: high enough that no honest review
  # reaches it, low enough that a loop stuck re-reading the same diff
  # stops inside one run instead of overnight.
  argus:
    trigger: repo-event
    events: [pull_request]
    placement: gh-actions
    max_cost_usd: 8.00
  # Same number, different enforcement path: agy takes no ceiling flag,
  # so atlas is measured against this after the fact. Atlas's own costs
  # are not in the sample above — its envelope reports .usage rather than
  # total_cost_usd, and #150 is why session_spend.sh cannot price it yet.
  # Matching argus is the defensible placeholder for a reviewer doing the
  # same duty on the same pull requests; retune it once #150 lands.
  atlas:
    trigger: repo-event
    events: [pull_request]
    placement: gh-actions
    max_cost_usd: 8.00
  athena:    { trigger: manual, placement: vm-local, max_cost_usd: 5.00 }
  daedalus:  { trigger: manual, placement: vm-local, max_cost_usd: 5.00 }
  odyssey:   { trigger: manual, placement: vm-local, max_cost_usd: 10.00 }
