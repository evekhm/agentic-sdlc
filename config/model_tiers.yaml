# Tier -> model bindings, per harness. THE ONLY LAYER (with the other
# config/ files) where vendor names appear; persona sources never name
# models (personas/schema.json, D3). Adjacent tiers may share a model:
# the tier names the task contract, not the price (AGENTS.md).
# This file is the only place a model is chosen. A workflow that pinned
# one in its environment would be a second binding nobody could find;
# the grant that once allowed that to win over this file is retired
# (#25, D15), and .github/workflows/unattended.yml names no model, no
# tier and no cost at all.

harnesses:
  claude-code:
    FAST: haiku                 # alias; enabled on this deployment
    MECHANICAL: claude-sonnet-5 # exact ID required: the "sonnet" alias
                                # resolves to sonnet-4.5, NOT enabled here
    IMPLEMENTATION: claude-sonnet-5
    REVIEW: opus
    FRONTIER: claude-fable-5-1  # exact ID (a `fable` alias exists; exact IDs
                                # are the convention here, see MECHANICAL).
                                # Spec gate only: REVIEW stays opus, Fable is
                                # 2x its rate and review runs every PR round (#105)

  antigravity:
    # All five tiers on Gemini 3.8 Flash, graded by thinking level, not
    # by model line (#271). Gemini 3.1 Pro was pinned here before and
    # hit an entitlement wall: `agy` serves a catalog per Antigravity
    # entitlement, a federated/ADC identity gets a narrower one than an
    # account login, and Pro's high-thinking id was absent from it —
    # the #167/#221 saga. Every id below (`-low`, `-medium`, `-high`) is
    # present in BOTH the account-login catalog and the
    # `AGY_ADC_AUTH=true` catalog the runner actually uses, verified
    # 2026-09-08 — no tier here can hit that wall. Verify a re-pin by a
    # live dispatch regardless; no gate here can see a catalog failure.
    FAST: gemini-3.8-flash-low
    MECHANICAL: gemini-3.8-flash-medium
    IMPLEMENTATION: gemini-3.8-flash-medium
    # FRONTIER moves with REVIEW because daedalus is `tier: FRONTIER` on
    # this same harness (personas/daedalus.yaml), NOT because of
    # deployments.yaml's distinct_model_families rule, which reaches
    # REVIEW and only REVIEW.
    REVIEW: gemini-3.8-flash-high
    FRONTIER: gemini-3.8-flash-high
