# Tier -> model bindings, per harness. THE ONLY LAYER (with the other
# config/ files) where vendor names appear; persona sources never name
# models (personas/schema.json, D3). Adjacent tiers may share a model:
# the tier names the task contract, not the price (AGENTS.md).
# This file is the only place a model is chosen. A workflow that pinned
# one in its environment would be a second binding nobody could find;
# the grant that once allowed that to win over this file is retired
# (#25, D15), and .github/workflows/unattended.yml names no model, no
# tier and no cost at all.

harnesses:
  claude-code:
    FAST: haiku                 # alias; enabled on this deployment
    MECHANICAL: claude-sonnet-5 # exact ID required: the "sonnet" alias
                                # resolves to sonnet-4.5, NOT enabled here
    IMPLEMENTATION: claude-sonnet-5
    REVIEW: opus
    FRONTIER: claude-fable-5-1  # exact ID (a `fable` alias exists; exact IDs
                                # are the convention here, see MECHANICAL).
                                # Spec gate only: REVIEW stays opus, Fable is
                                # 2x its rate and review runs every PR round (#105)

  antigravity:
    FAST: gemini-3.8-flash-medium   # or -low; `agy models` lists runtime
    MECHANICAL: gemini-3.8-flash-high
    IMPLEMENTATION: gemini-3.8-flash-high
    # Pro (Low) with thinking, and the id is not a typo: `agy` serves a
    # narrower catalog under ADC (`AGY_ADC_AUTH=true`, what a runner
    # uses) than under an account login, and where it answers at all it
    # offers exactly one Pro-tier id — this one. `gemini-3.1-pro-high`
    # resolves on a laptop and on no runner.
    #
    # This pin is necessary and NOT sufficient: atlas's 17-second deaths
    # (#167) are the catalog FETCH failing outright, because Cloud Code
    # Private API is disabled on the project, and with no catalog `agy`
    # rejects every id. Enabling that API is a human action. Verify an
    # antigravity re-pin by a live dispatch; no gate here can see either
    # failure. FRONTIER moves with REVIEW because daedalus is
    # `tier: FRONTIER` on this same harness (personas/daedalus.yaml),
    # NOT because of deployments.yaml's distinct_model_families rule,
    # which reaches REVIEW and only REVIEW.
    REVIEW: gemini-3.1-pro-low-thinking
    FRONTIER: gemini-3.1-pro-low-thinking
